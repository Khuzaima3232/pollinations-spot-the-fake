<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Spot the fake — one of these is AI</title>
<meta name="description" content="Two photographs of the same animal. One is real, one was generated by AI. Can you tell which?" />
<style>
  :root {
    --bg: #0d0f13;
    --panel: #161a21;
    --line: #262c36;
    --ink: #eef1f6;
    --dim: #9aa4b2;
    --real: #34d399;
    --fake: #f87171;
    --accent: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .stats { margin-left: auto; display: flex; gap: 16px; color: var(--dim); font-size: 13px; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }

  main { flex: 1; display: flex; flex-direction: column; padding: 18px; gap: 14px; max-width: 1180px; width: 100%; margin: 0 auto; }
  .prompt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .prompt h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .prompt .subject { color: var(--accent); }

  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .board { grid-template-columns: 1fr; } }

  .card {
    position: relative; border: 2px solid var(--line); border-radius: 14px;
    overflow: hidden; background: var(--panel); cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
  .card .tag {
    position: absolute; top: 10px; left: 10px; padding: 3px 9px;
    border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .4px;
    background: rgba(13,15,19,.82); border: 1px solid var(--line);
  }
  .card.correct { border-color: var(--real); }
  .card.wrong { border-color: var(--fake); }
  .card.dimmed { opacity: .5; }
  .card[aria-disabled="true"] { cursor: default; }
  .card[aria-disabled="true"]:hover { border-color: inherit; }

  .verdict { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: var(--panel); }
  .verdict h3 { margin: 0 0 6px; font-size: 15px; }
  .verdict .good { color: var(--real); }
  .verdict .bad { color: var(--fake); }
  .verdict ul { margin: 8px 0 0; padding-left: 20px; color: var(--dim); }
  .verdict li { margin: 4px 0; }
  .verdict .credit { color: var(--dim); font-size: 12.5px; margin-top: 10px; }
  .verdict .credit a { color: var(--accent); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; font-weight: 600; padding: 9px 16px; border-radius: 10px;
    border: 1px solid var(--line); background: #1d232c; color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #14121f; border-color: transparent; }
  button[hidden] { display: none; }

  .hint { color: var(--dim); font-size: 13px; }
  footer { padding: 12px 18px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12.5px; }
  footer a { color: var(--accent); }
  .share { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--ink); white-space: pre-line; }
</style>
</head>
<body>
  <header>
    <h1>Spot the <span>fake</span></h1>
    <div class="stats">
      <span>streak <b id="streak">0</b></span>
      <span>best <b id="best">0</b></span>
      <span>round <b id="round">1</b></span>
    </div>
  </header>

  <main>
    <div class="prompt">
      <h2>One of these is a real photograph. One was made by AI. Which is real?</h2>
      <span class="hint" id="subject"></span>
    </div>

    <div class="board" id="board" role="group" aria-label="Two images, one real and one generated"></div>

    <div class="verdict" id="verdict" hidden></div>

    <div class="row">
      <button class="primary" id="next" hidden>Next round</button>
      <button id="restart" hidden>Start over</button>
      <span class="hint" id="score-hint"></span>
    </div>
  </main>

  <footer>
    Real photographs are lead images from Wikipedia articles, shown with a link to their page.
    Fakes are generated with Pollinations using
    <a href="https://gen.pollinations.ai/docs" target="_blank" rel="noopener">black-forest-labs/flux.1-schnell</a>.
    No sign-in needed.
  </footer>

<script src="game.js"></script>
</body>
</html>
